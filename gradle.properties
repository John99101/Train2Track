org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# --- Gradle daemon JVM ------------------------------------------------------
# The JDK that runs Gradle is selected by gradle/gradle-daemon-jvm.properties
# (currently JetBrains JDK 21, an LTS), auto-provisioned via the foojay
# toolchain resolver. To change it, edit toolchainVersion in that file rather
# than pinning a path here.
# ---------------------------------------------------------------------------
android.useAndroidX=true
kotlin.code.style=official
# kapt (Hilt/Room annotation processing) needs this on newer Gradle/JDKs.
kapt.use.worker.api=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
